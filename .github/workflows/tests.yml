name: MediaServer tests

on:
  push:
    branches:
      - catalog-cleanup-1500-refresh
      - main
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q src
